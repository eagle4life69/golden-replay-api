name: Patch v0.1.14

on:
  push:
    branches:
      - fix/cache-refresh-v0.1.14

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cache-refresh-v0.1.14

      - name: Apply cache refresh fix
        run: python3 tools/patch-v014.py

      - name: Validate PHP syntax
        run: php -l golden-replay-api.php

      - name: Commit patched API
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add golden-replay-api.php
          git commit -m "Refresh catalog caches for v0.1.14"
          git push origin HEAD:fix/cache-refresh-v0.1.14
