name: Patch v0.1.13

on:
  push:
    branches:
      - feature/fix-season-browse-v0.1.13

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fix-season-browse-v0.1.13

      - name: Apply v0.1.13 fixes
        run: python3 tools/patch-v013.py

      - name: Validate PHP syntax
        run: php -l golden-replay-api.php

      - name: Commit patched API
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add golden-replay-api.php
          git commit -m "Fix series counts and derived year browsing for v0.1.13"
          git push origin HEAD:feature/fix-season-browse-v0.1.13
