name: Build v0.1.22 scheduled episode support
on:
  push:
    branches: [feature/scheduled-episodes-v0.1.22]
    paths: [.github/workflows/build-v0.1.22.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scheduled-episodes-v0.1.22
      - name: Patch API
        shell: python
        run: |
          from pathlib import Path
          p=Path('golden-replay-api.php')
          s=p.read_text()
          s=s.replace('Version: 0.1.21','Version: 0.1.22',1).replace("define( 'GRAPI_VERSION', '0.1.21' );","define( 'GRAPI_VERSION', '0.1.22' );",1)
          s=s.replace("'publish' !== $post->post_status", "! in_array( $post->post_status, array( 'publish', 'future' ), true )", 1)
          s=s.replace("if(!$post||'publish'!==$post->post_status){continue;}", "if(!$post||!in_array($post->post_status,array('publish','future'),true)){continue;}")
          s=s.replace("'post_status'=>'publish'", "'post_status'=>array('publish','future')")
          s=s.replace("if(!$post||'publish'!==$post->post_status){continue;}", "if(!$post||!in_array($post->post_status,array('publish','future'),true)){continue;}")
          s=s.replace("if(!$post||'publish'!==$post->post_status){return null;}", "if(!$post||!in_array($post->post_status,array('publish','future'),true)){return null;}")
          old="'credits'=>$content['credits'],'availability'=>array('status'=>'published','available'=>true,'scheduled_for'=>null)"
          new="'credits'=>$content['credits'],'availability'=>array('status'=>('future'===$post->post_status?'scheduled':'published'),'available'=>('publish'===$post->post_status),'scheduled_for'=>('future'===$post->post_status?get_post_time(DATE_ATOM,false,$post):null))"
          if old not in s: raise SystemExit('availability payload pattern not found')
          s=s.replace(old,new,1)
          # /latest must remain playable/published only even though the catalog now includes future posts.
          s=s.replace("$latest_ids = get_posts( array( 'post_type'=>'post','post_status'=>array('publish','future'),'post__in'=>$ids", "$latest_ids = get_posts( array( 'post_type'=>'post','post_status'=>'publish','post__in'=>$ids",1)
          p.write_text(s)

          r=Path('README.md')
          t=r.read_text()
          t=t.replace('0.1.21','0.1.22')
          marker='## v0.1.22\n\n- Includes scheduled (`future`) WordPress episodes in series discovery, seasons, episode indexes, and `/episodes`.\n- Scheduled episodes expose `availability.status = scheduled`, `available = false`, and `scheduled_for`.\n- `/latest` remains published/playable episodes only.\n- Direct `/episode/{id}` lookups now support scheduled episodes.\n\n'
          if '## v0.1.22' not in t:
              idx=t.find('## ')
              t=t[:idx]+marker+t[idx:] if idx>=0 else marker+t
          r.write_text(t)

          Path('RELEASE-NOTES-v0.1.22.md').write_text('''# Golden Replay API v0.1.22\n\n## Scheduled episode support\n\n- Includes WordPress scheduled/future episodes in series discovery and catalog indexes.\n- Includes scheduled episodes in season/year browsing and `/episodes`.\n- Scheduled episode payloads report `availability.status` as `scheduled`, `available` as `false`, and expose the scheduled publication time in `scheduled_for`.\n- Direct episode lookup supports both published and scheduled episodes.\n- `/latest` intentionally remains published-only so it always returns a playable episode.\n\nThis allows a series to appear in Golden Replay before its first queued episode has been published while preserving the distinction between available and upcoming audio.\n''')
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/build-v0.1.22.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add golden-replay-api.php README.md RELEASE-NOTES-v0.1.22.md .github/workflows/build-v0.1.22.yml
          git commit -m "Add scheduled episode support for v0.1.22"
          git push origin HEAD:feature/scheduled-episodes-v0.1.22
